name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Metadata only: no checkout, secrets, or write permissions.
      - name: Validate Conventional Commit format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          const pattern = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_.\/-]+\))?!?: \S[^\r\n]*$/
          assert(pattern.test(process.env.PR_TITLE ?? ''),
            'Use a Conventional Commit title, e.g. fix: handle timeouts, feat: support Firefox, or feat!: change config format')
          NODE
