name: Publish
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry_tag:
        description: 'Optional existing release tag to retry (e.g. v0.1.1); blank syncs the release PR'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  release:
    name: Update release PR or create release
    if: >-
      github.repository == 'vickism/ai-ui-tests' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
      (github.actor == 'vickism' && github.triggering_actor == 'vickism'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created || steps.retry.outputs.release_created }}
      version: ${{ steps.release.outputs.version || steps.retry.outputs.version }}
      sha: ${{ steps.release.outputs.sha || steps.retry.outputs.sha }}
      tag: ${{ steps.release.outputs.tag_name || steps.retry.outputs.tag_name }}
    steps:
      # Write permissions stay in this metadata-only job; no repository checkout.
      - name: Maintain release PR and GitHub release
        if: inputs.retry_tag == ''
        id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          token: ${{ github.token }}
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Resolve existing release for retry
        if: inputs.retry_tag != ''
        id: retry
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY_TAG: ${{ inputs.retry_tag }}
        run: |
          [[ "$RETRY_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'Expected a stable tag such as v0.1.1'; exit 1; }
          tag="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RETRY_TAG" --jq 'if .draft or .prerelease then error("Expected a published stable release") else .tag_name end')"
          sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$tag" --jq .sha)"
          echo 'release_created=true' >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  prepare:
    name: Validate and package
    needs: release
    if: needs.release.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Verify release commit belongs to main
        env:
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          assert.equal(pkg.name, '@vickism/ai-ui-tests')
          assert.equal(pkg.version, process.env.RELEASE_VERSION, 'Version confirmation must match package.json')
          assert.equal(`v${pkg.version}`, process.env.RELEASE_TAG, 'Release tag must match package.json')
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable versions can be published to latest')
          assert.equal(lock.name, pkg.name)
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].name, pkg.name)
          assert.equal(lock.packages[''].version, pkg.version)
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) })
          assert.equal(response.status, 404, response.ok
            ? `${pkg.name}@${pkg.version} is already published; bump the version first`
            : `Registry check failed: HTTP ${response.status}`)
          NODE
      - run: npm ci
      - name: Audit dependencies
        run: npm run audit
      - run: npm run build
      - run: npm test
      - name: Check package contents and CLI
        run: bash .github/scripts/check-package.sh
      - name: Record archive checksum
        working-directory: ${{ runner.temp }}/npm-package
        run: sha256sum ./*.tgz > SHA256SUMS
      - name: Upload checked package
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/npm-package/*.tgz
            ${{ runner.temp }}/npm-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Release summary
        env:
          RELEASE_VERSION: ${{ needs.release.outputs.version }}
          RELEASE_SHA: ${{ needs.release.outputs.sha }}
        run: |
          echo "### Ready for approval: @vickism/ai-ui-tests@$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit, build, tests, package contents, and CLI smoke checks passed.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/npm-package/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment's required reviewer and main-only policy first.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, or repository scripts in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download checked package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish checked archive with trusted publishing
        working-directory: release
        run: npm publish ./*.tgz --access public --provenance --ignore-scripts
