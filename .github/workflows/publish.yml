name: Publish
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version already committed in package.json (e.g. 0.1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate and package
    if: >-
      github.repository == 'vickism/ai-ui-tests' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'vickism' &&
      github.triggering_actor == 'vickism'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - name: Validate release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          assert.equal(pkg.name, '@vicksim/ai-ui-tests')
          assert.equal(pkg.version, process.env.RELEASE_VERSION, 'Version confirmation must match package.json')
          assert.match(pkg.version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Only stable versions can be published to latest')
          assert.equal(lock.name, pkg.name)
          assert.equal(lock.version, pkg.version)
          assert.equal(lock.packages[''].name, pkg.name)
          assert.equal(lock.packages[''].version, pkg.version)
          const url = `https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${pkg.version}`
          const response = await fetch(url, { signal: AbortSignal.timeout(30000) })
          assert.equal(response.status, 404, response.ok
            ? `${pkg.name}@${pkg.version} is already published; bump the version first`
            : `Registry check failed: HTTP ${response.status}`)
          NODE
      - run: npm ci
      - name: Audit dependencies
        run: npm run audit
      - run: npm run build
      - run: npm test
      - name: Check package contents and CLI
        run: bash .github/scripts/check-package.sh
      - name: Record archive checksum
        working-directory: ${{ runner.temp }}/npm-package
        run: sha256sum ./*.tgz > SHA256SUMS
      - name: Upload checked package
        id: archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-package
          path: |
            ${{ runner.temp }}/npm-package/*.tgz
            ${{ runner.temp }}/npm-package/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
      - name: Release summary
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          echo "### Ready for approval: @vicksim/ai-ui-tests@$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Audit, build, tests, package contents, and CLI smoke checks passed.' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/npm-package/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to npm
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure this environment's required reviewer and main-only policy first.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      # No checkout, dependency install, or repository scripts in this job.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - name: Download checked package from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: release
      - name: Verify archive checksum
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Publish checked archive with trusted publishing
        working-directory: release
        run: npm publish ./*.tgz --access public --provenance --ignore-scripts
